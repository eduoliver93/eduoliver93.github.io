<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Eduardo Santos de Oliveira -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block with Image</title>
    <meta name="description" content="A hero block with a background image and a tinted overlay.">
    <link rel="preload" href="assets/img/business.jpg" as="image">

    <!-- Link to Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom styles -->
    <style type="text/tailwindcss">

     header::before {
    content: "";
    @apply absolute inset-0
           bg-linear-to-b
           from-blue-950/70
           to-pink-900/30;
}

        header {
    @apply bg-center md:bg-top;
}

header {
@apply relative
    min-h-[60vh] md:min-h-[80vh]
    bg-[url('assets/img/business.jpg')] bg-cover bg-center
    flex flex-col justify-center
    px-8 lg:px-60 py-12
    text-center;
}

        header h1 {
    @apply text-7xl md:text-8xl
        text-white font-bold
        tracking-tight
        mb-6;
}

        header h2 {
            @apply text-4xl md:text-5xl
            text-white;
        }

header h1,
header h2 { @apply text-shadow-lg/50; }

    </style>

</head>


<body>

    <!-- hero block -->
     <header>
        <h1 class="slide-in-top">Albert Camus</h1>

        <h2 class="slide-in-left">Creative Web Developer</h2>
    </header>
    <!-- /hero block -->

</body>
</html>
