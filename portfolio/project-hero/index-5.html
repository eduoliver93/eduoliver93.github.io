<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero 5 | Eduardo Oliveira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Zilla+Slab&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #1c1c1c;
      line-height: 1.5
    }

    img {
      max-width: 100%;
      display: block
    }

    .btn {
      display: inline-block;
      padding: .85rem 1.8rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      background: #ff5a36;
      color: #fff;
      transition: opacity .2s
    }

    .btn:hover,
    .btn:focus-visible {
      opacity: .85
    }

    .btn:focus-visible {
      outline: 3px solid currentColor;
      outline-offset: 3px
    }

    header p {
      font-size: 1.1rem;
      max-width: 34rem;
      margin: 1.2rem 0 2rem
    }

    header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      min-height: 100vh;
      background: #14213d;
      color: #fff
    }

    header .text {
      padding: 4rem 6vw
    }

    header h1 {
      font-size: clamp(2.4rem, 5vw, 4.5rem);
      line-height: 1.1
    }

    header h2 {
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      font-weight: 400;
      margin-top: 1rem
    }

    header img {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      object-fit: cover;
    }

    @media (max-width:800px) {
      header {
        grid-template-columns: 1fr
      }

      header img {
        min-height: 0;
        height: 50vh;
        order: -1
      }

      header .text {
        padding: 3rem 1.5rem
      }
    }

    header .text {
      order: 2
    }

    @media (max-width:800px) {
      header .text {
        order: 0
      }
    }

    /* Google Fonts */
    header h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      letter-spacing: 4px;
    }

    header h2 {
      font-family: 'Zilla Slab', serif;
      font-weight: 400;
    }
  </style>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>

<body>
  <header>
    <div class="text">
      <h1>JENNIFER CHANG</h1>
      <h2>UI DESIGNER</h2>
      <p>Creating human-friendly interfaces for mobile and web apps.</p>
      <a class="btn btn-secondary" href="#">Recent work</a>
      <a class="btn btn-primary" href="#">Hire me</a>
    </div>
    <img src="assets/img/ui-designer.jpg" alt="UI designer sketching an app layout">
  </header>
</body>

</html>
