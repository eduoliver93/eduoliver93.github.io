<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero 1 | Eduardo Oliveira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #1c1c1c;
      line-height: 1.5
    }

    img {
      max-width: 100%;
      display: block
    }

    .btn {
      display: inline-block;
      padding: .85rem 1.8rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      background: #f5c518;
      color: #1c1c1c;
      transition: opacity .2s
    }

    .btn:hover,
    .btn:focus-visible {
      opacity: .85
    }

    .btn:focus-visible {
      outline: 3px solid currentColor;
      outline-offset: 3px
    }

    header p {
      font-size: 1.1rem;
      max-width: 34rem;
      margin: 1.2rem 0 2rem
    }

    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      padding: 2rem;
      background: linear-gradient(rgba(20, 10, 50, .35), rgba(20, 10, 50, .35)), url('assets/img/duotone.jpg') center/cover no-repeat #2a1b5e
    }

    header .text {
      max-width: 48rem
    }

    header h1 {
      font-size: clamp(2.8rem, 8vw, 6rem);
      line-height: 1.05
    }

    header h2 {
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      font-weight: 400;
      margin-top: 1rem
    }

    header p {
      margin-left: auto;
      margin-right: auto
    }

    /* Google Font */
    header h1,
    header h2 {
      font-family: 'Abril Fatface', serif;
      letter-spacing: 1px;
    }
  </style>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>

<body>
  <header>
    <div class="text">
      <h1>Snazzy Headphones</h1>
      <h2>Enjoy tunes while you develop software</h2>
      <a class="btn btn-primary" href="#">Order now</a>
      <a class="btn btn-secondary" href="#">Learn more</a>
    </div>
  </header>
</body>

</html>
